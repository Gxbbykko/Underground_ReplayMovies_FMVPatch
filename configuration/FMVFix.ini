; FMVFix MP4 Framework Stage 2.5.2 — full catalog + explicit 1080p diagnostics
[FMVFix]
; ==========================================================================
; FMVFix video mode
; ==========================================================================
;
; Mode=Xbox
;   Native Xbox .mad picture + native .mad audio/timing/lifecycle.
;   No MP4 video replacement is attempted.
;
; Mode=1080p
;   MP4 replacement tier intended for 1920x1080-class output.
;   Normal 2:1 FMVs use 2160x1080 MP4 sources so Underground/FMVFix keeps
;   ownership of the final 16:9 crop/framing instead of baking a crop into MP4.
;   E3_TITLE uses a square 2160x2160 MP4 source.
;
; Mode=4K
;   MP4 replacement tier intended for 3840x2160-class output.
;   Normal 2:1 FMVs use 3840x1920 MP4 sources.
;   E3_TITLE uses a square 3840x3840 MP4 source.
;
; Selected-tier MP4 locations:
;   MOVIES\MovieHD\1080p\<movie>.mp4
;   MOVIES\MovieHD\4K\<movie>.mp4
;
; There is NO cross-tier fallback.
; If the selected MP4 is missing, invalid, late, or cannot decode, that exact
; native MAD frame remains visible. The .mad always owns audio, timing, skip/end,
; and movie lifecycle.
;
; FULL ACTIVE CATALOG (20 movies):
;   NA_BOOT, PSA, E3_TITLE,
;   01_DAY, 02_FAN_S, 02_FAN_E, 04_GUM_S, 05_ENG, 06_SAM, 07_GOD,
;   08_EDD, 09_GBE, 11_PNK, 12_BUD, 13_KIT, 14_MUT, 15_DIK, 16_RES,
;   17_MET, 19_FIN
;
; 1080p reports ALL 20 movies because that tier is not yet validated.
; 4K keeps the prior Stage 2.5 policy of reporting only the 15 newly-added movies.
;
; Startup tier/path manifest:
;   MOVIES\MovieHD\Reports\FMVFix_MP4Startup_<tier>.txt
;
; Runtime reports are mode-specific so 1080p can never overwrite 4K evidence:
;   MOVIES\MovieHD\Reports\FMVFix_MP4Runtime_<tier>_<movie>_G<generation>.txt
; A canonical mode-specific report is promoted only after a complete exact zero-miss session.
;
Mode=1080p
